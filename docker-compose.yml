version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: ticket_mysql_db
    restart: always
    environment:
      MYSQL_DATABASE: ticket_system
      MYSQL_ROOT_PASSWORD: Mb@32923293
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: ticket_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=Mb@32923293
      - DB_NAME=ticket_system
      - JWT_SECRET=your_enterprise_jwt_secret_key
    depends_on:
      - db

volumes:
  mysql_data: